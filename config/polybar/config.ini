include-file = colors.generated.ini

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 38
radius = 0
offset-x = 0
offset-y = 0
fixed-center = true

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 0
border-size = 0
padding-left = 0
padding-right = 4
module-margin = 3

font-0 = "Noto Sans:size=11;2"
font-1 = "Noto Sans Mono:size=11;2"
font-2 = "Symbols Nerd Font Mono:size=12;3"

wm-restack = i3
override-redirect = false
enable-ipc = true

modules-left = i3
modules-center = date weather spotify
modules-right = memory cpu filesystem network pulseaudio dnd

tray-position = ${env:TRAY_POSITION:none}
tray-padding = 8
tray-maxsize = 20

cursor-click = pointer
cursor-scroll = ns-resize

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
wrapping-scroll = false
strip-wsnumbers = false

label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.warn}
label-mode-foreground = #111111

label-focused = %name%
label-focused-minlen = 3
label-focused-alignment = center
label-focused-padding = 2
label-focused-background = ${colors.accent}
label-focused-foreground = #111111

label-unfocused = %name%
label-unfocused-minlen = 3
label-unfocused-alignment = center
label-unfocused-padding = 2
label-unfocused-foreground = ${colors.fg}

label-visible = %name%
label-visible-minlen = 3
label-visible-alignment = center
label-visible-padding = 2

label-urgent = %name%
label-urgent-minlen = 3
label-urgent-alignment = center
label-urgent-padding = 2
label-urgent-background = ${colors.urgent}
label-urgent-foreground = #111111

[module/date]
type = internal/date
interval = 1
date = %a %d %b
date-alt = %A %d %B %Y
time = %H:%M
time-alt = %H:%M:%S
format-prefix = "%{T3}%{T-} "
format-prefix-foreground = ${colors.clock}
label = %date%  %time%
label-padding = 1
click-left = ~/.config/polybar/scripts/date-popup.sh
click-right = ~/.scripts/desk weather

[module/spotify]
type = custom/script
interval = 2
exec = ~/.config/polybar/scripts/spotify-status.sh
format = <label>
label = %output%
label-minlen = 80
label-maxlen = 80
label-alignment = left
label-ellipsis = true
click-left = playerctl --player=spotify play-pause
click-right = playerctl --player=spotify next
click-middle = playerctl --player=spotify previous

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "%{T3}󰍛%{T-} "
format-prefix-foreground = ${colors.cpu}
label = %percentage%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "%{T3}󰘚%{T-} "
format-prefix-foreground = ${colors.memory}
label = %percentage_used%%

[module/filesystem]
type = internal/fs
interval = 20
mount-0 = /
format-mounted-prefix = "%{T3}%{T-} "
format-mounted-prefix-foreground = ${colors.disk}
label-mounted = %free%
label-mounted-foreground = ${colors.fg}
label-unmounted = n/a
label-unmounted-foreground = ${colors.muted}

[module/network]
type = internal/network
interface = ${env:DEFAULT_IFACE:}
interval = 3
accumulate-stats = true
unknown-as-up = true

format-connected-prefix = "%{T3}%{T-} "
format-connected-prefix-foreground = ${colors.network}
label-connected = %essid%
click-left = ~/.scripts/desk wifi

format-disconnected-prefix = "%{T3}󰖪%{T-} "
format-disconnected-prefix-foreground = ${colors.network}
label-disconnected = down
label-disconnected-foreground = ${colors.muted}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 2

format-volume-prefix = "%{T3}%{T-} "
format-volume-prefix-foreground = ${colors.volume}
label-volume = %percentage%%

label-muted = %{T3}%{T-} muted
label-muted-foreground = ${colors.volume}
click-left = ~/.scripts/desk audio

[module/weather]
type = custom/script
interval = 600
exec = ~/.scripts/desk weather-bar
format-prefix = "%{T3}󰖐%{T-} "
format-prefix-foreground = ${colors.accent}
label = %output%
click-left = ~/.scripts/desk weather

[module/dnd]
type = custom/script
interval = 2
exec = ~/.scripts/desk notify status
format = <label>
label = %output%
label-foreground = ${colors.warn}
click-left = ~/.scripts/desk notify dnd-toggle

[settings]
screenchange-reload = true
pseudo-transparency = true
