# Minimal compositor setup for translucent/blurred bars.
backend = "glx";
vsync = true;
shadow = false;
fading = true;
fade-delta = 6;
fade-in-step = 0.06;
fade-out-step = 0.06;

active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;

corner-radius = 0;
blur-method = "dual_kawase";
blur-strength = 2;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;
blur-background-exclude = [
  "class_g = 'Dunst'",
  "name = 'xfce4-screenshooter'",
  "class_g = 'Xfce4-screenshooter'",
  "class_g = 'flameshot'",
  "class_g = 'deepin-screen-recorder'",
  "class_g = 'Deepin-screen-recorder'",
  # ranger image overlays (w3mimgdisplay / ueberzugpp)
  "class_g ~= 'ueberzug'",
  "name ~= 'ueberzug'",
  "class_g = 'w3m'",
  "name = 'w3mimgdisplay'"
];

wintypes:
{
  dock = { opacity = 0.88; };
  tooltip = { fade = true; shadow = false; opacity = 0.95; focus = true; };
};
